<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lift Me Up</title>
  <meta name="description" content="A short morning reading: one true founder story, one verified philosophy quote, one thought for the day.">
  <meta name="theme-color" content="#f7f2ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14110e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <div id="banner" class="banner" hidden></div>
    <main id="view" class="view" tabindex="-1" aria-live="polite">
      <p class="loading">Opening today's reading…</p>
    </main>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="/" data-link data-tab="today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17h16M7 17a5 5 0 0 1 10 0M12 6v2M5.6 9.6l1.4 1.4M18.4 9.6 17 11"/></svg>
        <span>Today</span>
      </a>
      <a href="/archive" data-link data-tab="archive">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 9h16M9 3v4M15 3v4"/></svg>
        <span>Archive</span>
      </a>
      <a href="/saved" data-link data-tab="saved">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1z"/></svg>
        <span>Saved</span>
      </a>
      <a href="/settings" data-link data-tab="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
        <span>Settings</span>
      </a>
    </nav>
  </div>
  <noscript><p class="noscript">Lift Me Up needs JavaScript to show your reading.</p></noscript>
</body>
</html>
